version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge_password
      POSTGRES_DB: bridge_validator
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge_validator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bridge-network

  worker:
    build:
      context: .
      dockerfile: bridge_validator/Dockerfile
    image: bridge-validator
    container_name: bridge-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # All env vars are auto-generated by setup.js into .env.bridge.validator
    env_file:
      - ./.env.bridge.validator

    networks:
      - bridge-network

volumes:
  postgres_data:
    driver: local

networks:
  bridge-network:
    driver: bridge
