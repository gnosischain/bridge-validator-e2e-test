version: "3.8"

# Rust bridge validator stack.
#
# The `worker` image is NOT buildable from this repo — build it from the
# bridge-validator first: https://github.com/gnosischain/bridge-validator/
#
# Override the tag with BRIDGE_VALIDATOR_IMAGE to pin a different build
# (e.g. BRIDGE_VALIDATOR_IMAGE=gnosischain/bridge-validator:v0.1.3).

services:
  postgres:
    image: postgres:16-alpine
    container_name: bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge_password
      POSTGRES_DB: bridge_validator
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge_validator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bridge-network

  worker:
    image: ${BRIDGE_VALIDATOR_IMAGE:-bridge-validator:fcr}
    container_name: bridge-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # All env vars are auto-generated by setup.js into .env.bridge.validator
    env_file:
      - ./.env.bridge.validator
    # The EL mock proxy (`npm run mock`) runs on the host; the validator reaches
    # it via host.docker.internal (explicit for non-Docker-Desktop hosts).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bridge-network

volumes:
  postgres_data:
    driver: local

networks:
  bridge-network:
    driver: bridge
