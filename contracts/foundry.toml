[profile.default]
src = "."
out = "out"
libs = []
# Only EventAccountingContract.sol lives here; keep the monitor out of the way.
skip = ["monitor/**"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
gnosis = "${GC_RPC}"

[etherscan]
gnosis = { key = "${GNOSISSCAN_API_KEY}", chain = 100 }
