name: Clean up Tenderly VNets

# Backstop for runs whose teardown never ran (runner lost, job killed): delete
# CI VNets (slug "e2e-ci-…") older than 3 hours. VNets made outside CI are
# never touched.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node src/setup/teardown.js --sweep --older-than-hours 3
        env:
          TENDERLY_API_TOKEN: ${{ secrets.TENDERLY_API_TOKEN }}
          TENDERLY_ACCOUNT_ID: ${{ secrets.TENDERLY_ACCOUNT_ID }}
          TENDERLY_PROJECT: ${{ secrets.TENDERLY_PROJECT }}
